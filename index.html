<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mineru-layout-viewer 测试</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="./dist/mineru-layout-viewer.iife.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; font-family: system-ui, sans-serif; }
.drop-zone {
  height: 100%; display: flex; align-items: center; justify-content: center; margin: 20px;
  border: 2px dashed #d0d0d0; border-radius: 12px; cursor: pointer; transition: all .2s;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background: rgba(59,130,246,.04); }
.drop-zone .hint { text-align: center; color: #888; }
.drop-zone .hint h3 { font-size: 18px; color: #333; margin-bottom: 8px; }
.drop-zone .hint p { font-size: 13px; margin: 2px 0; }
.drop-zone .hint a { color: #3b82f6; }
.choices { display:flex; gap:10px; justify-content:center; margin:18px 0 10px; }
.choices button { border:1px solid #3b82f6; border-radius:7px; padding:8px 14px; background:#fff; color:#2563eb; cursor:pointer; }
.choices button.primary { background:#2563eb; color:#fff; }
.load-status { min-height:20px; margin-top:10px; color:#2563eb; font-size:12px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="dropZone" class="drop-zone">
  <div class="hint">
    <h3>MinerU 图片审核编辑器</h3>
    <p>拖放 MinerU 导出 ZIP、结果文件夹或单个 Markdown / Org 文件</p>
    <p>支持图片定位、替换、软删除、撤销和导出修改版 ZIP</p>
    <div class="choices">
      <button id="chooseZip" class="primary" type="button">选择 ZIP</button>
      <button id="chooseFolder" type="button">选择结果文件夹</button>
      <button id="chooseMarkdown" type="button">选择 Markdown / Org</button>
    </div>
    <p id="loadStatus" class="load-status"></p>
    <p style="font-size:11px;margin-top:12px">
      <a href="https://www.npmjs.com/package/mineru-layout-viewer" target="_blank">npm</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/rand777gg/mineru-layout-viewer" target="_blank">GitHub</a>
    </p>
  </div>
</div>

<mineru-layout-viewer id="viewer" class="hidden" style="height:100%">
  <div slot="loading" style="display:flex;align-items:center;justify-content:center;height:100%;color:#888">加载中…</div>
</mineru-layout-viewer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

const dropZone = document.getElementById('dropZone')
const viewer = document.getElementById('viewer')
const loadStatus = document.getElementById('loadStatus')

document.getElementById('chooseZip').addEventListener('click', e => {
  e.stopPropagation()
  const input = document.createElement('input')
  input.type = 'file'; input.accept = '.zip'
  input.onchange = () => handleFiles([...input.files])
  input.click()
})

document.getElementById('chooseFolder').addEventListener('click', async e => {
  e.stopPropagation()
  if ('showDirectoryPicker' in window) {
    let handle
    try {
      handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'mineru-result-folder' })
    } catch (error) {
      if (error?.name === 'AbortError') return
      console.warn('可写目录选择不可用，回退到只读选择', error)
    }
    if (handle) {
      try {
        loadStatus.textContent = `正在读取可写文件夹：${handle.name}`
        dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
        await viewer.loadDirectoryHandle(handle)
        return
      } catch (error) {
        viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
        alert(error instanceof Error ? error.message : String(error))
        return
      }
    }
  }
  const input = document.createElement('input')
  input.type = 'file'; input.webkitdirectory = true; input.multiple = true
  input.onchange = () => handleDirectory(input.files)
  input.click()
})

document.getElementById('chooseMarkdown').addEventListener('click', async e => {
  e.stopPropagation()
  if ('showOpenFilePicker' in window) {
    try {
      const [handle] = await window.showOpenFilePicker({
        id: 'markdown-file',
        multiple: false,
        types: [
          { description: 'Markdown / Org', accept: { 'text/plain': ['.md', '.markdown', '.org'] } },
        ],
      })
      const file = await handle.getFile()
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadMarkdownFile(file, handle)
      return
    } catch (error) {
      if (error?.name === 'AbortError') return
      console.warn('可写文档选择不可用，回退到只读选择', error)
    }
  }
  const input = document.createElement('input')
  input.type = 'file'; input.accept = '.md,.markdown,.org,text/markdown,text/org,text/plain'
  input.onchange = () => handleFiles([...input.files])
  input.click()
})

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'))
dropZone.addEventListener('click', () => {
  const input = document.createElement('input')
  input.type = 'file'; input.accept = '.zip'
  input.onchange = () => handleFiles([...input.files])
  input.click()
})

dropZone.addEventListener('drop', async e => {
  e.preventDefault(); dropZone.classList.remove('drag-over')
  try {
    const handles = []
    for (const item of e.dataTransfer.items || []) {
      if (item.kind !== 'file' || !item.getAsFileSystemHandle) continue
      const handle = await item.getAsFileSystemHandle()
      if (handle) handles.push(handle)
    }
    const directory = handles.find(handle => handle.kind === 'directory')
    if (directory) {
      const writable = directory.requestPermission
        ? await directory.requestPermission({ mode: 'readwrite' }) === 'granted'
        : false
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadDirectoryHandle(directory, writable)
      return
    }
    const markdownHandle = handles.find(handle => handle.kind === 'file' && /\.(?:md|markdown|org)$/i.test(handle.name))
    if (markdownHandle) {
      const file = await markdownHandle.getFile()
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadMarkdownFile(file, markdownHandle)
      return
    }
    const legacyDirectory = [...e.dataTransfer.items]
      .map(item => item.webkitGetAsEntry?.())
      .find(entry => entry?.isDirectory)
    if (legacyDirectory) {
      const entries = []
      await collectLegacyDirectory(legacyDirectory, entries)
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadDirectoryEntries(entries)
      return
    }
    await handleFiles([...e.dataTransfer.files])
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    alert(error instanceof Error ? error.message : String(error))
  }
})

async function collectLegacyDirectory(entry, output) {
  const readBatch = reader => new Promise((resolve, reject) => reader.readEntries(resolve, reject))
  const readFile = fileEntry => new Promise((resolve, reject) => fileEntry.file(resolve, reject))
  const reader = entry.createReader()
  while (true) {
    const children = await readBatch(reader)
    if (!children.length) break
    for (const child of children) {
      if (child.isDirectory) await collectLegacyDirectory(child, output)
      else if (child.isFile) output.push({ path: child.fullPath.replace(/^\//, ''), file: await readFile(child) })
    }
  }
}

async function handleFiles(files) {
  try {
    const zip = files.find(f => f.name.toLowerCase().endsWith('.zip'))
    if (zip) {
      loadStatus.textContent = `正在打开 ${zip.name}（大文件请留意上方加载进度）`
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadZip(zip)
      return
    }
    const markdownFile = files.find(f => /\.(?:md|markdown|org)$/i.test(f.name))
    if (markdownFile && files.length === 1) {
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadMarkdownFile(markdownFile)
      return
    }
    let pdfFile, jsonFile
    for (const f of files) {
      if (f.name.toLowerCase().endsWith('.pdf')) pdfFile = f
      else if (f.name.toLowerCase().endsWith('.json')) jsonFile = f
    }
    if (jsonFile) {
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadLayoutFromJson(await jsonFile.text())
      if (pdfFile) viewer.setAttribute('pdf', URL.createObjectURL(pdfFile))
      return
    }
    throw new Error('请选择 MinerU ZIP、单个 Markdown / Org 文件，或同时选择 PDF 与 JSON')
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    alert(error instanceof Error ? error.message : String(error))
  }
}

async function handleDirectory(files) {
  if (!files || !files.length) return
  try {
    loadStatus.textContent = `正在读取文件夹（${files.length} 个文件）`
    dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
    await viewer.loadDirectory(files)
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    alert(error instanceof Error ? error.message : String(error))
  }
}
</script>
</body>
</html>
