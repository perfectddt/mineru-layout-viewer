<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mineru-layout-viewer 测试</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="./dist/mineru-layout-viewer.iife.js?v=20260901-pdf-virtual-2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; display:flex; flex-direction:column; font-family: system-ui, sans-serif; }
.drop-zone {
  flex:1; min-height:0; display: flex; align-items: center; justify-content: center; margin: 20px;
  border: 2px dashed #d0d0d0; border-radius: 12px; cursor: pointer; transition: all .2s;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background: rgba(59,130,246,.04); }
.drop-zone .hint { text-align: center; color: #888; }
.drop-zone .hint h3 { font-size: 18px; color: #333; margin-bottom: 8px; }
.drop-zone .hint p { font-size: 13px; margin: 2px 0; }
.drop-zone .hint a { color: #3b82f6; }
.choices { display:flex; gap:10px; justify-content:center; margin:18px 0 10px; }
.choices button { border:1px solid #3b82f6; border-radius:7px; padding:8px 14px; background:#fff; color:#2563eb; cursor:pointer; }
.choices button.primary { background:#2563eb; color:#fff; }
.load-status { min-height:20px; margin-top:10px; color:#2563eb; font-size:12px; }
.hidden { display: none !important; }
.app-toolbar { flex:0 0 42px; display:flex; align-items:center; padding:5px 10px; border-bottom:1px solid #e5e7eb; background:#f8fafc; }
.recent-launcher { position:relative; z-index:10000; }
.recent-launcher > button { border:1px solid #cbd5e1; border-radius:7px; padding:7px 11px; background:#fff; cursor:pointer; }
.recent-panel { position:absolute; top:37px; left:0; width:340px; max-height:65vh; overflow:auto; padding:10px; border:1px solid #d8dee8; border-radius:9px; background:#fff; box-shadow:0 12px 35px #0003; }
.recent-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; font-size:13px; font-weight:600; }
.recent-head button, .recent-remove { border:0; background:transparent; color:#64748b; cursor:pointer; }
.recent-item { display:flex; gap:6px; align-items:center; border-top:1px solid #eef2f7; }
.recent-open { flex:1; min-width:0; padding:9px 3px; border:0; background:transparent; text-align:left; cursor:pointer; }
.recent-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#1e293b; }
.recent-meta { display:block; margin-top:2px; color:#94a3b8; font-size:11px; }
</style>
</head>
<body>
<div class="app-toolbar">
  <div class="recent-launcher">
    <button id="recentToggle" type="button">最近打开</button>
    <div id="recentPanel" class="recent-panel hidden">
      <div class="recent-head"><span>最近打开</span><button id="recentClear" type="button">清空</button></div>
      <div id="recentList"></div>
    </div>
  </div>
</div>

<div id="dropZone" class="drop-zone">
  <div class="hint">
    <h3>MinerU 图片审核编辑器</h3>
    <p>拖放 MinerU 导出 ZIP、结果文件夹或单个 Markdown / Org 文件</p>
    <p>支持图片定位、替换、软删除、撤销和导出修改版 ZIP</p>
    <div class="choices">
      <button id="chooseZip" class="primary" type="button">选择 ZIP</button>
      <button id="chooseFolder" type="button">选择结果文件夹</button>
      <button id="chooseMarkdown" type="button">选择 Markdown / Org</button>
    </div>
    <p id="loadStatus" class="load-status"></p>
    <p style="font-size:11px;margin-top:12px">
      <a href="https://www.npmjs.com/package/mineru-layout-viewer" target="_blank">npm</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/rand777gg/mineru-layout-viewer" target="_blank">GitHub</a>
    </p>
  </div>
</div>

<mineru-layout-viewer id="viewer" class="hidden" style="flex:1;min-height:0">
  <div slot="loading" style="display:flex;align-items:center;justify-content:center;height:100%;color:#888">加载中…</div>
</mineru-layout-viewer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

const dropZone = document.getElementById('dropZone')
const viewer = document.getElementById('viewer')
const loadStatus = document.getElementById('loadStatus')
const recentPanel = document.getElementById('recentPanel')
const recentList = document.getElementById('recentList')
const RECENT_KEY = 'mineru-layout-viewer-recent-v1'
const HANDLE_DB = 'mineru-layout-viewer-handles-v1'
const launcherToken = new URLSearchParams(location.search).get('token') || ''

function getRecents() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]') } catch { return [] }
}

function saveRecents(items) {
  localStorage.setItem(RECENT_KEY, JSON.stringify(items.slice(0, 12)))
  renderRecents()
}

function openHandleDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(HANDLE_DB, 1)
    request.onupgradeneeded = () => request.result.createObjectStore('handles')
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error)
  })
}

async function storeHandle(id, handle) {
  const db = await openHandleDb()
  await new Promise((resolve, reject) => {
    const request = db.transaction('handles', 'readwrite').objectStore('handles').put(handle, id)
    request.onsuccess = resolve; request.onerror = () => reject(request.error)
  })
  db.close()
}

async function readHandle(id) {
  const db = await openHandleDb()
  const value = await new Promise((resolve, reject) => {
    const request = db.transaction('handles').objectStore('handles').get(id)
    request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error)
  })
  db.close(); return value
}

async function rememberHandle(handle) {
  const id = `handle:${handle.kind}:${handle.name}`
  await storeHandle(id, handle)
  rememberRecent({ id, source:'handle', kind:handle.kind, name:handle.name })
}

function rememberRecent(item) {
  const items = getRecents().filter(entry => entry.id !== item.id)
  items.unshift({ ...item, openedAt:Date.now() })
  saveRecents(items)
}

function renderRecents() {
  const items = getRecents()
  recentList.replaceChildren()
  if (!items.length) { recentList.textContent = '还没有最近打开的内容'; return }
  for (const item of items) {
    const row = document.createElement('div'); row.className = 'recent-item'
    const open = document.createElement('button'); open.className = 'recent-open'; open.type = 'button'
    const name = document.createElement('span'); name.className = 'recent-name'; name.textContent = item.name
    const meta = document.createElement('span'); meta.className = 'recent-meta'
    meta.textContent = `${item.kind === 'directory' ? '文件夹' : '文件'} · ${new Date(item.openedAt).toLocaleString()}`
    open.append(name, meta); open.onclick = () => openRecent(item)
    const remove = document.createElement('button'); remove.className = 'recent-remove'; remove.textContent = '×'; remove.title = '移除'
    remove.onclick = () => saveRecents(getRecents().filter(entry => entry.id !== item.id))
    row.append(open, remove); recentList.append(row)
  }
}

async function openRecent(item) {
  try {
    if (item.source === 'launcher') {
      if (!launcherToken) throw new Error('请先通过 start-viewer.cmd 快捷方式启动一次，以取得本地服务授权')
      const response = await fetch(`/__viewer/open?token=${encodeURIComponent(launcherToken)}&path=${encodeURIComponent(item.path)}`)
      if (!response.ok) throw new Error('原路径已不存在或无法访问')
      location.href = (await response.json()).url
      return
    }
    const handle = await readHandle(item.id)
    if (!handle) throw new Error('浏览器中已没有该文件的访问凭据，请重新选择')
    let permission = await handle.queryPermission?.({ mode:'readwrite' })
    if (permission !== 'granted') permission = await handle.requestPermission?.({ mode:'readwrite' })
    if (permission !== 'granted') throw new Error('未授予文件访问权限')
    dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
    if (handle.kind === 'directory') await viewer.loadDirectoryHandle(handle, true)
    else {
      const file = await handle.getFile()
      if (/\.(?:md|markdown|org)$/i.test(file.name)) await viewer.loadMarkdownFile(file, handle)
      else await handleFiles([file])
    }
    rememberRecent(item); recentPanel.classList.add('hidden')
  } catch (error) { alert(error instanceof Error ? error.message : String(error)) }
}

document.getElementById('recentToggle').onclick = () => recentPanel.classList.toggle('hidden')
document.getElementById('recentClear').onclick = () => saveRecents([])
renderRecents()

async function loadLauncherTarget() {
  const params = new URLSearchParams(location.search)
  const launch = params.get('launch')
  const token = params.get('token')
  if (!launch || !token) return
  const query = `launch=${encodeURIComponent(launch)}&token=${encodeURIComponent(token)}`
  try {
    loadStatus.textContent = '正在读取从 Windows 打开的内容…'
    const manifest = await fetch(`/__viewer/manifest?${query}`).then(response => {
      if (!response.ok) throw new Error(`读取启动内容失败：HTTP ${response.status}`)
      return response.json()
    })
    rememberRecent({ id:`launcher:${manifest.path}`, source:'launcher', kind:manifest.kind, name:manifest.name, path:manifest.path })
    dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
    if (manifest.kind === 'file') {
      const blob = await fetch(`/__viewer/file?${query}`).then(response => response.blob())
      let currentFile = new File([blob], manifest.name, { type: blob.type })
      if (/\.(?:md|markdown|org)$/i.test(manifest.name)) {
        const localHandle = {
          kind: 'file',
          name: manifest.name,
          getFile: async () => currentFile,
          createWritable: async () => {
            let pending = new Blob([])
            return {
              write: async data => { pending = data instanceof Blob ? data : new Blob([data]) },
              close: async () => {
                const response = await fetch(`/__viewer/save?${query}`, { method: 'POST', body: pending })
                if (!response.ok) throw new Error(`覆盖保存失败：HTTP ${response.status}`)
                currentFile = new File([pending], manifest.name, { type: blob.type, lastModified: Date.now() })
              },
            }
          },
        }
        await viewer.loadMarkdownFile(currentFile, localHandle)
      } else {
        await handleFiles([currentFile])
      }
      return
    }
    const entries = []
    const directPdfPath = manifest.files.find(path => /_origin\.pdf$/i.test(path))
      || manifest.files.find(path => /\.pdf$/i.test(path))
    for (let index = 0; index < manifest.files.length; index++) {
      const path = manifest.files[index]
      if (path === directPdfPath) continue
      loadStatus.textContent = `正在读取文件夹：${index + 1}/${manifest.files.length}`
      const blob = await fetch(`/__viewer/file?${query}&path=${encodeURIComponent(path)}`).then(response => response.blob())
      entries.push({ path, file: new File([blob], path.split('/').pop(), { type: blob.type }) })
    }
    const directPdfUrl = directPdfPath
      ? `/__viewer/file?${query}&path=${encodeURIComponent(directPdfPath)}`
      : undefined
    await viewer.loadDirectoryEntries(entries, directPdfUrl, directPdfPath)
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    loadStatus.textContent = error instanceof Error ? error.message : String(error)
  }
}

document.getElementById('chooseZip').addEventListener('click', e => {
  e.stopPropagation()
  const input = document.createElement('input')
  input.type = 'file'; input.accept = '.zip'
  input.onchange = () => handleFiles([...input.files])
  input.click()
})

document.getElementById('chooseFolder').addEventListener('click', async e => {
  e.stopPropagation()
  if ('showDirectoryPicker' in window) {
    let handle
    try {
      handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'mineru-result-folder' })
    } catch (error) {
      if (error?.name === 'AbortError') return
      console.warn('可写目录选择不可用，回退到只读选择', error)
    }
    if (handle) {
      try {
        loadStatus.textContent = `正在读取可写文件夹：${handle.name}`
        dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
        await viewer.loadDirectoryHandle(handle)
        await rememberHandle(handle)
        return
      } catch (error) {
        viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
        alert(error instanceof Error ? error.message : String(error))
        return
      }
    }
  }
  const input = document.createElement('input')
  input.type = 'file'; input.webkitdirectory = true; input.multiple = true
  input.onchange = () => handleDirectory(input.files)
  input.click()
})

document.getElementById('chooseMarkdown').addEventListener('click', async e => {
  e.stopPropagation()
  if ('showOpenFilePicker' in window) {
    try {
      const [handle] = await window.showOpenFilePicker({
        id: 'markdown-file',
        multiple: false,
        types: [
          { description: 'Markdown / Org', accept: { 'text/plain': ['.md', '.markdown', '.org'] } },
        ],
      })
      const file = await handle.getFile()
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadMarkdownFile(file, handle)
      await rememberHandle(handle)
      return
    } catch (error) {
      if (error?.name === 'AbortError') return
      console.warn('可写文档选择不可用，回退到只读选择', error)
    }
  }
  const input = document.createElement('input')
  input.type = 'file'; input.accept = '.md,.markdown,.org,text/markdown,text/org,text/plain'
  input.onchange = () => handleFiles([...input.files])
  input.click()
})

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'))
dropZone.addEventListener('click', () => {
  const input = document.createElement('input')
  input.type = 'file'; input.accept = '.zip'
  input.onchange = () => handleFiles([...input.files])
  input.click()
})

dropZone.addEventListener('drop', async e => {
  e.preventDefault(); dropZone.classList.remove('drag-over')
  try {
    const handles = []
    for (const item of e.dataTransfer.items || []) {
      if (item.kind !== 'file' || !item.getAsFileSystemHandle) continue
      const handle = await item.getAsFileSystemHandle()
      if (handle) handles.push(handle)
    }
    const directory = handles.find(handle => handle.kind === 'directory')
    if (directory) {
      const writable = directory.requestPermission
        ? await directory.requestPermission({ mode: 'readwrite' }) === 'granted'
        : false
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadDirectoryHandle(directory, writable)
      await rememberHandle(directory)
      return
    }
    const markdownHandle = handles.find(handle => handle.kind === 'file' && /\.(?:md|markdown|org)$/i.test(handle.name))
    if (markdownHandle) {
      const file = await markdownHandle.getFile()
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadMarkdownFile(file, markdownHandle)
      await rememberHandle(markdownHandle)
      return
    }
    const legacyDirectory = [...e.dataTransfer.items]
      .map(item => item.webkitGetAsEntry?.())
      .find(entry => entry?.isDirectory)
    if (legacyDirectory) {
      const entries = []
      await collectLegacyDirectory(legacyDirectory, entries)
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadDirectoryEntries(entries)
      return
    }
    await handleFiles([...e.dataTransfer.files])
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    alert(error instanceof Error ? error.message : String(error))
  }
})

async function collectLegacyDirectory(entry, output) {
  const readBatch = reader => new Promise((resolve, reject) => reader.readEntries(resolve, reject))
  const readFile = fileEntry => new Promise((resolve, reject) => fileEntry.file(resolve, reject))
  const reader = entry.createReader()
  while (true) {
    const children = await readBatch(reader)
    if (!children.length) break
    for (const child of children) {
      if (child.isDirectory) await collectLegacyDirectory(child, output)
      else if (child.isFile) output.push({ path: child.fullPath.replace(/^\//, ''), file: await readFile(child) })
    }
  }
}

async function handleFiles(files) {
  try {
    const zip = files.find(f => f.name.toLowerCase().endsWith('.zip'))
    if (zip) {
      loadStatus.textContent = `正在打开 ${zip.name}（大文件请留意上方加载进度）`
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadZip(zip)
      return
    }
    const markdownFile = files.find(f => /\.(?:md|markdown|org)$/i.test(f.name))
    if (markdownFile && files.length === 1) {
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadMarkdownFile(markdownFile)
      return
    }
    let pdfFile, jsonFile
    for (const f of files) {
      if (f.name.toLowerCase().endsWith('.pdf')) pdfFile = f
      else if (f.name.toLowerCase().endsWith('.json')) jsonFile = f
    }
    if (jsonFile) {
      dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
      await viewer.loadLayoutFromJson(await jsonFile.text())
      if (pdfFile) viewer.setAttribute('pdf', URL.createObjectURL(pdfFile))
      return
    }
    throw new Error('请选择 MinerU ZIP、单个 Markdown / Org 文件，或同时选择 PDF 与 JSON')
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    alert(error instanceof Error ? error.message : String(error))
  }
}

loadLauncherTarget()

async function handleDirectory(files) {
  if (!files || !files.length) return
  try {
    loadStatus.textContent = `正在读取文件夹（${files.length} 个文件）`
    dropZone.classList.add('hidden'); viewer.classList.remove('hidden')
    await viewer.loadDirectory(files)
  } catch (error) {
    viewer.classList.add('hidden'); dropZone.classList.remove('hidden')
    alert(error instanceof Error ? error.message : String(error))
  }
}
</script>
</body>
</html>
